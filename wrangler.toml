# Cloudflare Workers 部署配置
# 线上 worker 实际名: my-openai-proxy（绑定 ai.blupure.cn）
# 部署: npx wrangler deploy
# 注意：本文件不包含任何密钥。所有密钥必须走 Cloudflare 控制台 → Secrets：
#   PB_URL / PB_ADMIN_EMAIL / PB_ADMIN_PASSWORD
#   ZHIPU_KEY / CHATANYWHERE_KEY / SILICONFLOW_KEY / DEEPSEEK_KEY / NVIDIA_KEY
#   XFSPARK_X2_KEY / XFSPARK_X2_FLASH_KEY / OPENROUTER_KEY / AGNES_KEY
#   H5_APP_ID / H5_APP_SECRET / PAY_NOTIFY_URL
#   MAPAY_API_URL / MAPAY_APPID / MAPAY_APPKEY
name = "my-openai-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# 社区动态 30 天自动清理（北京时间每天 12:10）
[triggers]
crons = ["10 4 * * *"]

# 封面图持久缓存（Agnes 出图 URL 转 base64 后存 KV，TTL 7 天，前端不落 localStorage）
[[kv_namespaces]]
binding = "COVER_CACHE"
id = "05ff1df6441843368cec0b55bb74c847"
